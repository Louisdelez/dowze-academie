[package]
name = "dowze-academie"
version = "0.1.0"
description = "Application macOS local-first pour organiser cursus, planning, notes, évaluations et assistants IA contextuels"
authors = ["Louis Délez"]
license = "MIT"
homepage = "https://dowze.academie.ch"
repository = "https://github.com/Louisdelez/dowze-academie"
edition = "2021"

[lib]
name = "dowze_academie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
argon2 = "0.5.3"
chrono = "0.4.42"
ipnet = "2.12.1"
keyring = { version = "3.6.3", features = ["apple-native"] }
open = "5.4.2"
rand = "0.8.5"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "~2.11.0", features = ["unstable"] }
tauri-plugin-dialog = "2.7.2"
tokio = { version = "1.53.1", features = ["net"] }
zeroize = "1.8.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSSet", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataRecord", "WKWebsiteDataStore"] }
