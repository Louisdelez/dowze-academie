name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare_release:
    name: Prepare draft release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Checkout release tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create or reuse the draft release
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_BODY: |
            Release publique multiplateforme de Dowze Academie.

            - macOS Apple Silicon : DMG ARM64
            - macOS Intel : DMG x64
            - Windows : installateur NSIS x64
            - Linux : AppImage x64 et paquet Debian x64

            Les applications macOS utilisent une signature ad hoc et ne sont pas notarisées par Apple. L’installateur Windows n’est pas signé. Sous Linux, les comptes locaux nécessitent une session D-Bus avec un service Secret Service accessible et déverrouillé. Consultez le README et les limites connues avant installation.
        run: |
          set -euo pipefail
          app_version="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          cargo_version="$(node -p "require('fs').readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version = \\\"([^\\\"]+)\\\"/m)[1]")"
          test "$app_version" = "$package_version" && test "$app_version" = "$cargo_version" || {
            echo "Application versions differ: Tauri=$app_version package=$package_version Cargo=$cargo_version"
            exit 1
          }
          expected_tag="v${app_version}"
          test "$RELEASE_TAG" = "$expected_tag" || {
            echo "Tag $RELEASE_TAG does not match application version $expected_tag"
            exit 1
          }
          if release_id="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId 2>/dev/null)"; then
            is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            test "$is_draft" = "true" || {
              echo "Release $RELEASE_TAG is already public; refusing to replace its assets."
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "Dowze Academie $RELEASE_TAG" \
              --notes "$RELEASE_BODY"
            release_id="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          fi
          test -n "$release_id"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare_release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            rust_target: aarch64-apple-darwin
            bundle_args: --target aarch64-apple-darwin --bundles dmg
            asset_suffix: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            bundle_args: --target x86_64-apple-darwin --bundles dmg
            asset_suffix: macos-x64
          - name: Windows x64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            bundle_args: --target x86_64-pc-windows-msvc --bundles nsis
            asset_suffix: windows-x64
          - name: Linux x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundle_args: --target x86_64-unknown-linux-gnu --bundles appimage,deb
            asset_suffix: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-08
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify application versions
        shell: bash
        run: |
          app_version="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          cargo_version="$(node -p "require('fs').readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version = \\\"([^\\\"]+)\\\"/m)[1]")"
          if [ "$app_version" != "$package_version" ] || [ "$app_version" != "$cargo_version" ]; then
            echo "Application versions differ: Tauri=$app_version package=$package_version Cargo=$cargo_version"
            exit 1
          fi
          expected_tag="v${app_version}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match application version $expected_tag"
            exit 1
          fi

      - name: Build preflight artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          args: ${{ matrix.bundle_args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: Dowze-Academie-[platform]-[arch]-[bundle]
          uploadUpdaterJson: false

      - name: Build release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare_release.outputs.release_id }}
          uploadUpdaterJson: false
          retryAttempts: 2
          args: ${{ matrix.bundle_args }}
          releaseAssetNamePattern: Dowze-Academie-v[version]-${{ matrix.asset_suffix }}[setup][ext]

  finalize-release:
    name: Verify and publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download and verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets

          version="${RELEASE_TAG#v}"
          required_assets=(
            "Dowze-Academie-v${version}-macos-arm64.dmg"
            "Dowze-Academie-v${version}-macos-x64.dmg"
            "Dowze-Academie-v${version}-windows-x64-setup.exe"
            "Dowze-Academie-v${version}-linux-x64.AppImage"
            "Dowze-Academie-v${version}-linux-x64.deb"
          )
          for asset in "${required_assets[@]}"; do
            test -s "release-assets/$asset" || {
              echo "Missing or empty required release asset: $asset"
              exit 1
            }
          done

          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum
          ) > release-assets/SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
