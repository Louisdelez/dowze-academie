# Exemple simplifié ; ne pas remplacer automatiquement une configuration active.
upstream dowze_backend {
    server dowze-internal.example:30482;
}
server {
    listen 443 ssl;
    server_name academie.dowze.ch;
    ssl_certificate /etc/ssl/dowze/fullchain.pem;
    ssl_certificate_key /etc/ssl/dowze/privkey.pem;
    location / {
        proxy_pass http://dowze_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
