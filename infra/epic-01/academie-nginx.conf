worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 17m;
  client_body_timeout 30s;
  keepalive_timeout 15s;
  map $uri $dowze_cache_control {
    default no-cache;
    ~^/v1/ "";
    ~^/downloads/ "public, max-age=31536000, immutable";
  }
  map $uri $dowze_disposition {
    default "";
    ~^/downloads/ attachment;
  }
  server {
    listen 10.0.0.4:30482;
    server_name academie.dowze.ch academie.delez.ovh;
    root /public;
    # Only the HTTPS edge may reach the application over the private tunnel.
    allow 10.0.0.1;
    deny all;
    disable_symlinks on;
    add_header Cache-Control $dowze_cache_control;
    add_header Content-Disposition $dowze_disposition;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    location = /healthz {
      allow all;
      default_type application/json;
      return 200 '{"ok":true,"system":"dowze-academie"}';
    }
    location /v1/ {
      proxy_pass http://127.0.0.1:30582;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      # The edge overwrites this value from the verified PROXY protocol address.
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header Connection "";
      proxy_read_timeout 60s;
      proxy_connect_timeout 5s;
      proxy_buffering off;
    }
    location = /app { return 308 /app/; }
    location = /app/sw.js { try_files $uri =404; }
    location /app/ { try_files $uri $uri/ /app/index.html; }
    location /downloads/ {
      try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
  }
}
