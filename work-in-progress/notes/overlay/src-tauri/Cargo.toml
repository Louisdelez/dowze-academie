[package]
name = "dowze-academie"
version = "0.12.8"
description = "Application de bureau local-first pour organiser cursus, planning, notes, évaluations et assistants IA contextuels"
authors = ["Louis Délez"]
license = "MIT"
homepage = "https://github.com/Louisdelez/dowze-academie"
repository = "https://github.com/Louisdelez/dowze-academie"
edition = "2021"
autobins = false

[[bin]]
name = "dowze-academie"
path = "src/main.rs"

[lib]
name = "dowze_academie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
argon2 = "0.5.3"
chrono = "0.4.42"
ipnet = "2.12.1"
open = "5.4.2"
rand = "0.8.5"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
minisign-verify = "0.2.5"
semver = "1"
base64 = "0.22.1"
tauri = { version = "~2.11.0", features = ["unstable"] }
tauri-plugin-dialog = "2.7.2"
tokio = { version = "1.53.1", features = ["net"] }
zeroize = "1.8.1"
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
objc2 = "0.6.4"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSSet", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataRecord", "WKWebsiteDataStore"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }
